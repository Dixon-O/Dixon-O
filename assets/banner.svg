<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d"/>
      <stop offset="50%" stop-color="#111116"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="gold-primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a47d3c"/>
      <stop offset="25%" stop-color="#d4b067"/>
      <stop offset="50%" stop-color="#fae29c"/>
      <stop offset="75%" stop-color="#d4b067"/>
      <stop offset="100%" stop-color="#997233"/>
    </linearGradient>

    <linearGradient id="gold-subtle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cfb06b"/>
      <stop offset="100%" stop-color="#806330"/>
    </linearGradient>

    <radialGradient id="grace-glow" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#917228" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0a0a0d" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="rune-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-serif {
      font-family: 'Cinzel', 'Palatino Linotype', 'Book Antiqua', 'Palatino', 'Georgia', serif;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .title {
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .subtitle {
      letter-spacing: 0.26em;
      text-transform: uppercase;
    }
    .kicker {
      letter-spacing: 0.35em;
      text-transform: uppercase;
      font-size: 10px;
    }
    .tags {
      letter-spacing: 0.20em;
      font-size: 9.5px;
      text-transform: uppercase;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="960" height="260" fill="url(#bg-grad)" rx="4"/>

  <!-- Radial Grace Center Glow -->
  <circle cx="480" cy="120" r="260" fill="url(#grace-glow)"/>

  <!-- Geometrical Runic Orbit Rings (Grace Arcs & Neural Nodes) -->
  <g opacity="0.22" stroke="url(#gold-primary)" fill="none" stroke-width="0.75">
    <!-- Center intersecting celestial rings -->
    <circle cx="480" cy="125" r="160" stroke-dasharray="2 6"/>
    <circle cx="480" cy="125" r="115"/>
    <circle cx="480" cy="125" r="85" stroke-dasharray="4 8"/>
    <circle cx="480" cy="65" r="115"/>
    <circle cx="480" cy="185" r="115"/>
    
    <!-- Central Cardinal Axes -->
    <line x1="480" y1="15" x2="480" y2="245" stroke-width="0.5" stroke-opacity="0.4"/>
    <line x1="280" y1="125" x2="680" y2="125" stroke-width="0.5" stroke-opacity="0.4"/>
    
    <!-- Delicate 45deg diagonals -->
    <line x1="395" y1="40" x2="565" y2="210" stroke-width="0.5" stroke-dasharray="1 7"/>
    <line x1="395" y1="210" x2="565" y2="40" stroke-width="0.5" stroke-dasharray="1 7"/>
  </g>

  <!-- Outer Fine Dual Frame -->
  <rect x="18" y="18" width="924" height="224" fill="none" stroke="#2a251d" stroke-width="1" rx="2"/>
  <rect x="24" y="24" width="912" height="212" fill="none" stroke="url(#gold-subtle)" stroke-width="0.7" stroke-opacity="0.6"/>

  <!-- Ornamental Corner Brackets -->
  <g stroke="url(#gold-primary)" stroke-width="1.5" fill="none">
    <path d="M 20 34 L 20 20 L 34 20" />
    <circle cx="20" cy="20" r="1.5" fill="#d4b067"/>
    
    <path d="M 940 34 L 940 20 L 926 20" />
    <circle cx="940" cy="20" r="1.5" fill="#d4b067"/>
    
    <path d="M 20 226 L 20 240 L 34 240" />
    <circle cx="20" cy="240" r="1.5" fill="#d4b067"/>
    
    <path d="M 940 226 L 940 240 L 926 240" />
    <circle cx="940" cy="240" r="1.5" fill="#d4b067"/>
  </g>

  <!-- Midpoint Diamond Embellishments -->
  <g fill="url(#gold-primary)">
    <polygon points="480,19 483,24 480,29 477,24" />
    <polygon points="480,231 483,236 480,241 477,236" />
    <polygon points="19,125 24,122 29,125 24,128" />
    <polygon points="931,125 936,122 941,125 936,128" />
  </g>

  <!-- Grace Sigil / Spark at Top Center -->
  <g transform="translate(480, 56)" filter="url(#rune-glow)">
    <circle cx="0" cy="0" r="3" fill="#fae29c"/>
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#fae29c" stroke-width="1"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#fae29c" stroke-width="1"/>
    <line x1="-6" y1="-6" x2="6" y2="6" stroke="#d4b067" stroke-width="0.7"/>
    <line x1="-6" y1="6" x2="6" y2="-6" stroke="#d4b067" stroke-width="0.7"/>
  </g>

  <!-- Kicker / Inscription -->
  <text x="480" y="86" text-anchor="middle" class="font-serif kicker" fill="#a48d61">
    EMBOLDENED BY THE FLAME OF AMBITION
  </text>

  <!-- Main Title -->
  <text x="480" y="132" text-anchor="middle" class="font-serif title" font-size="34" fill="url(#gold-primary)" filter="url(#rune-glow)">
    DIXON OSURE
  </text>

  <!-- Horizontal divider lines under name -->
  <g stroke="url(#gold-primary)" stroke-width="0.75" opacity="0.6">
    <line x1="330" y1="148" x2="450" y2="148"/>
    <polygon points="480,146 482,148 480,150 478,148" fill="#d4b067"/>
    <line x1="510" y1="148" x2="630" y2="148"/>
  </g>

  <!-- Subtitle: AI Centric -->
  <text x="480" y="172" text-anchor="middle" class="font-serif subtitle" font-size="11" fill="#d2c9b4">
    Architect of Autonomous Agents &amp; AI-Native Systems
  </text>

  <!-- Lower Tech Pillars / Runes -->
  <g class="font-serif tags" fill="#998768" text-anchor="middle">
    <text x="480" y="206">
      <tspan fill="#d4b067">◈</tspan> AUTONOMOUS AGENTS   
      <tspan fill="#d4b067">·</tspan> INTELLIGENT DIAGNOSTICS   
      <tspan fill="#d4b067">·</tspan> MODEL HARNESSES   
      <tspan fill="#d4b067">·</tspan> DISTRIBUTED PROTOCOLS <tspan fill="#d4b067">◈</tspan>
    </text>
  </g>
</svg>